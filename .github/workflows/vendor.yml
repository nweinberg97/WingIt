name: vendor
# Copies WingIt's libraries into vendor/, pins every model to an exact commit, and records the
# SHA-256 of every file in vendor/integrity.json. Runs when the pinned versions change, or by hand.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - vendor.config.json
      - scripts/vendor.mjs
      - .github/workflows/vendor.yml
permissions:
  contents: write
concurrency:
  group: vendor
  cancel-in-progress: false
jobs:
  vendor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build vendor/ and integrity manifest
        run: |
          set -o pipefail
          node scripts/vendor.mjs 2>&1 | tee vendor.log || { echo "::error title=vendor failed::$(tail -c 900 vendor.log | tr '\n' ' ')"; exit 1; }
      - name: Show what changed
        run: |
          echo "::notice title=vendor sizes::$(du -sh vendor vendor/* | tr '\n' ' ')"
          echo "::notice title=manifest::$(node -e "const m=require('./vendor/integrity.json');console.log(Object.keys(m.files).length+' files, version '+m.version)")"
      - name: Commit
        run: |
          git config user.name "wingit-vendor-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vendor
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "Vendor pinned libraries and integrity manifest"
          if ! out=$(git push 2>&1); then
            echo "::error title=push failed::$(echo "$out" | tr '\n' ' ' | cut -c1-900)"
            exit 1
          fi
